name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing secret CLOUDFLARE_API_TOKEN. Create a token with Workers Scripts Edit at https://developers.cloudflare.com/fundamentals/api/get-started/create-token/ then: gh secret set CLOUDFLARE_API_TOKEN -R catalystctl/catalyst-website"
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID (secret or variable)."
            exit 1
          fi
          echo "Cloudflare credentials present."

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Bind GitHub token to the Worker
        # Optional: create a read-only token and store it as STATS_GITHUB_TOKEN.
        # With it, the Worker's GitHub calls are authenticated (5000/hr) instead
        # of the 60/hr anonymous limit, so the stats and the template catalog
        # never go stale.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          STATS_GITHUB_TOKEN: ${{ secrets.STATS_GITHUB_TOKEN }}
        run: |
          if [ -n "$STATS_GITHUB_TOKEN" ]; then
            echo "$STATS_GITHUB_TOKEN" | npx wrangler secret put GITHUB_TOKEN
          else
            echo "STATS_GITHUB_TOKEN is not set; the Worker will fetch GitHub stats unauthenticated."
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
