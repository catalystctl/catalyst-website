<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Catalyst, an open-source game server panel built on containerd">
  <title>Catalyst, an open-source game server panel built on containerd</title>

  <!--
    Catalyst OG card. Mirrors the site's "deck" design system:
    warm charcoal ground, one signal bloom top-left, Oxanium display type,
    deck-label eyebrows with a 6px square marker, and a real dashboard panel
    (LEDs, mono values, micro meters, hairline rows, key-hint status bar).
    Fonts resolve via scripts/render-og.mjs, which points fontconfig at
    scripts/og-fonts.
  -->

  <defs>
    <!-- Ambient signal bloom, mirroring .app-shell::before -->
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C48D5A" stop-opacity="0.10"/>
      <stop offset="58%" stop-color="#C48D5A" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="panelClip">
      <rect x="660" y="158" width="468" height="314" rx="8"/>
    </clipPath>
  </defs>

  <!-- Ground -->
  <rect width="1200" height="630" fill="#161412"/>
  <ellipse cx="0" cy="-101" rx="1000" ry="580" fill="url(#bloom)"/>

  <!-- Panel hairline frame, mirroring the shadow-panel token -->
  <rect x="0.5" y="0.5" width="1199" height="629" fill="none" stroke="#FFFFFF" stroke-opacity="0.043"/>

  <!-- ═══════════════ Left: identity ═══════════════ -->

  <!-- deck-label eyebrow: 6px signal square + Oxanium micro-caps -->
  <rect x="72" y="214" width="6" height="6" fill="#C48D5A"/>
  <text x="90" y="221" font-family="Oxanium" font-size="11" font-weight="600" letter-spacing="1.76" fill="#9D9A95">OPEN SOURCE · GPLV3 · EARLY TESTING</text>

  <!-- Wordmark -->
  <text x="72" y="306" font-family="Oxanium" font-size="62" font-weight="600" letter-spacing="-1.24" fill="#F3F2F2">Catalyst</text>

  <!-- Subtitle -->
  <text x="72" y="356" font-family="DM Sans" font-size="19" font-weight="400" fill="#9D9A95">An open-source game server panel built on containerd.</text>

  <!-- Pipeline, mono micro -->
  <text x="72" y="396" font-family="JetBrains Mono" font-size="13" font-weight="400" fill="#9D9A95" fill-opacity="0.75">panel <tspan fill-opacity="0.4">(TypeScript)</tspan> → agent <tspan fill-opacity="0.4">(Rust)</tspan> → <tspan fill="#C48D5A">containerd</tspan></text>

  <!-- Footer -->
  <text x="72" y="566" font-family="JetBrains Mono" font-size="13" font-weight="500" fill="#9D9A95" fill-opacity="0.55">catalystctl.com</text>

  <!-- ═══════════════ Right: fleet panel ═══════════════ -->

  <g clip-path="url(#panelClip)">
    <rect x="660" y="158" width="468" height="314" fill="#1C1A17"/>

    <!-- Header strip -->
    <rect x="660" y="158" width="468" height="44" fill="#211F1B"/>
    <rect x="660" y="201" width="468" height="1" fill="#3B3830" fill-opacity="0.5"/>
    <rect x="676" y="177" width="6" height="6" fill="#C48D5A"/>
    <text x="690" y="185" font-family="Oxanium" font-size="11" font-weight="600" letter-spacing="1.76" fill="#9D9A95">FLEET VITALS</text>
    <text x="1112" y="185" font-family="DM Sans" font-size="11" font-weight="400" fill="#9D9A95" fill-opacity="0.8" text-anchor="end">View all →</text>

    <!-- Row separators -->
    <g fill="#3B3830" fill-opacity="0.4">
      <rect x="660" y="240" width="468" height="1"/>
      <rect x="660" y="278" width="468" height="1"/>
      <rect x="660" y="316" width="468" height="1"/>
      <rect x="660" y="354" width="468" height="1"/>
      <rect x="660" y="392" width="468" height="1"/>
    </g>

    <!-- Rows: overline label, mono value -->
    <g font-family="DM Sans" font-size="11" font-weight="500" letter-spacing="0.88" fill="#9D9A95">
      <text x="676" y="225">SERVERS</text>
      <text x="676" y="263">NODES</text>
      <text x="676" y="301">CPU</text>
      <text x="676" y="339">MEMORY</text>
      <text x="676" y="377">NETWORK</text>
      <text x="676" y="415">ALERTS</text>
    </g>

    <g font-family="JetBrains Mono" font-size="13" font-weight="600" fill="#F3F2F2">
      <text x="778" y="225">2/4</text>
      <text x="778" y="263">1/2</text>
      <text x="778" y="301">18%</text>
      <text x="778" y="339">31%</text>
      <text x="778" y="377">42 MB/s</text>
      <text x="778" y="415">1</text>
    </g>

    <!-- Micro meters: empty tracks, then fills -->
    <g fill="#FFFFFF" fill-opacity="0.08">
      <rect x="894" y="220" width="120" height="4" rx="2"/>
      <rect x="894" y="258" width="120" height="4" rx="2"/>
      <rect x="894" y="296" width="120" height="4" rx="2"/>
      <rect x="894" y="334" width="120" height="4" rx="2"/>
      <rect x="894" y="372" width="120" height="4" rx="2"/>
      <rect x="894" y="410" width="120" height="4" rx="2"/>
    </g>
    <rect x="894" y="296" width="22" height="4" rx="2" fill="#C48D5A"/>
    <rect x="894" y="334" width="37" height="4" rx="2" fill="#23B370"/>
    <rect x="894" y="372" width="50" height="4" rx="2" fill="#3F7AD9"/>

    <!-- Right-hand hints -->
    <g font-family="DM Sans" font-size="11" font-weight="400" fill="#9D9A95" fill-opacity="0.8" text-anchor="end">
      <text x="1112" y="225">2 running</text>
      <text x="1112" y="263">1 connected</text>
      <text x="1112" y="415">1 unacknowledged</text>
    </g>

    <!-- Status bar -->
    <rect x="660" y="430" width="468" height="42" fill="#211F1B"/>
    <rect x="660" y="430" width="468" height="1" fill="#3B3830" fill-opacity="0.5"/>

    <g>
      <circle cx="680" cy="451" r="4" fill="#23B370"/>
      <circle cx="680" cy="451" r="4" fill="none" stroke="#161412" stroke-opacity="0.55"/>
      <text x="692" y="455" font-family="JetBrains Mono" font-size="11" fill="#9D9A95">2</text>
      <text x="706" y="455" font-family="DM Sans" font-size="11" font-weight="500" letter-spacing="0.88" fill="#9D9A95">RUNNING</text>

      <circle cx="806" cy="451" r="4" fill="#9D9A95" fill-opacity="0.5"/>
      <circle cx="806" cy="451" r="4" fill="none" stroke="#161412" stroke-opacity="0.55"/>
      <text x="818" y="455" font-family="JetBrains Mono" font-size="11" fill="#9D9A95">1</text>
      <text x="832" y="455" font-family="DM Sans" font-size="11" font-weight="500" letter-spacing="0.88" fill="#9D9A95">STOPPED</text>

      <circle cx="924" cy="451" r="4" fill="#DF9516"/>
      <circle cx="924" cy="451" r="4" fill="none" stroke="#161412" stroke-opacity="0.55"/>
      <text x="936" y="455" font-family="JetBrains Mono" font-size="11" fill="#9D9A95">1</text>
      <text x="950" y="455" font-family="DM Sans" font-size="11" font-weight="500" letter-spacing="0.88" fill="#9D9A95">ISSUE</text>
    </g>

    <g font-family="JetBrains Mono" font-size="11" fill="#9D9A95" fill-opacity="0.7" text-anchor="end">
      <text x="1112" y="455">↑↓ navigate</text>
    </g>
  </g>

  <!-- Panel edge -->
  <rect x="660.5" y="158.5" width="467" height="313" rx="8" fill="none" stroke="#3B3830" stroke-opacity="0.75"/>
</svg>
